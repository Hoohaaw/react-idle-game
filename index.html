<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#0f0305" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Idle Game — Browser Idle RPG</title>
    <meta name="description" content="Recruit heroes, send them on missions, clear dungeons and raids, and build your party in this browser-based idle RPG." />

    <!-- Open Graph / Twitter card. Domain is the free Vercel deploy (react-idle-game-three.vercel.app)
         until a paid custom domain is bought — swap again then. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="The Idle Game — Browser Idle RPG" />
    <meta property="og:description" content="Recruit heroes, send them on missions, clear dungeons and raids, and build your party in this browser-based idle RPG." />
    <meta property="og:image" content="https://react-idle-game-three.vercel.app/og-image.png" />
    <meta property="og:url" content="https://react-idle-game-three.vercel.app/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="The Idle Game — Browser Idle RPG" />
    <meta name="twitter:description" content="Recruit heroes, send them on missions, clear dungeons and raids, and build your party in this browser-based idle RPG." />
    <meta name="twitter:image" content="https://react-idle-game-three.vercel.app/og-image.png" />

    <!-- Umami analytics (cookieless) — SPA route changes don't trigger a new script load, so
         App.tsx wires a useLocation()-based hook to call umami.track() on navigation. -->
    <script defer src="https://cloud.umami.is/script.js" data-website-id="5b39c383-d76f-401e-9527-5455e4c7b9e1"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
